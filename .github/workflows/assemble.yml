name: Assemble verified Face-Off
on:
  push:
    branches: [faceoff-themes-g57-completion]
    paths: ['.delivery/ready.json']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore checksummed source and preserve Classic
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma, shutil
          ready = json.loads(Path('.delivery/ready.json').read_text())
          payload = ''.join(Path(f'.delivery/part-{i:02d}.txt').read_text().strip() for i in range(ready['parts']))
          raw = base64.b64decode(payload, validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == ready['sha256'], f'Package checksum mismatch: {actual}'
          source = json.loads(lzma.decompress(raw))
          allowed = {'index.html','faceoff-next.js','faceoff-next.css','README.md','Start Face-Off.bat','.gitignore','content/sets.txt','tools/build_bank.py','tests/validate.py','tests/verify_answers.py','tests/browser.py','tests/classic_manifest.json','tests/requirements.txt','docs/teaching-notes.md'}
          assert set(source) == allowed
          if not Path('classic.html').exists():
              assert hashlib.sha256(Path('index.html').read_bytes()).hexdigest() == 'd5867fdab4afb285d234af426e4d3f6ccfad2ec9f8f0acdd590779965c3fa2df'
              shutil.copyfile('index.html', 'classic.html')
          for name, text in source.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          # Isolate frame selection from the intentional offline CDN test.
          # The subsequent online context tests the actual Classic React app.
          target = Path('tests/browser.py')
          text = target.read_text()
          needle = '        # Classic navigation. The source hash test separately proves preservation.'
          patch = "        if not embedded:\n            context.route(re.compile(r'/classic\\.html$'),lambda r:r.fulfill(status=200,content_type='text/html',body='<html><body></body></html>'))\n"
          assert text.count(needle) == 1
          target.write_text(text.replace(needle, patch + needle))
          print('Checksum verified; 14 source files restored; original Classic preserved.')
      - name: Build and validate
        run: |
          python tools/build_bank.py
          node --check app.js
          node --check faceoff-next.js
          python tests/validate.py
          python tests/verify_answers.py
      - name: Install browser test dependencies
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser regression suite
        run: python tests/browser.py
      - name: Commit verified app to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html classic.html faceoff-next.js faceoff-next.css g57_bank.json README.md 'Start Face-Off.bat' .gitignore content tools tests docs assets sets
          git commit -m 'Complete Face-Off: preserve Classic, add eight themes and 192 questions'
          git push origin HEAD:faceoff-themes-g57-completion
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faceoff-completed
          path: |
            .
            !.git/**
            !**/__pycache__/**
          include-hidden-files: true
          retention-days: 30
