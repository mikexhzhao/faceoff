name: Verify Face-Off
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and all new answers
        run: |
          node --check app.js
          node --check faceoff-next.js
          python tests/validate.py
          python tests/verify_answers.py
      - name: Install browser test dependencies
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser regression suite
        run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faceoff-verified
          path: |
            .
            !.git/**
            !.delivery/**
            !**/__pycache__/**
          include-hidden-files: true
          retention-days: 30
